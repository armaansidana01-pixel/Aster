    <script>
      // Per AI Studio runtime constraints: HMR is disabled in preview iframe; ignore Vite WebSocket reconnection rejections
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('closed without opened') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.onunhandledrejection = function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('closed without opened') ||
          msg.includes('@vite/client')
        ) {
          if (event && event.preventDefault) event.preventDefault();
          return true;
        }
      };
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('closed without opened') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.onerror = function (msg, url, line, col, error) {
        var str = String(msg || '') + ' ' + String(url || '') + ' ' + (error ? String(error.message || error.stack || '') : '');
        if (
          str.includes('WebSocket') ||
          str.includes('vite:ws') ||
          str.includes('closed without opened') ||
          str.includes('@vite/client')
        ) {
          return true;
        }
      };
    </script>
